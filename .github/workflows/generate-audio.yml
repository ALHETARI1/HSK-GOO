name: Generate HSK Audio Files

on:
  workflow_dispatch:  # تشغيل يدوي من تبويب Actions بضغطة زر

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate audio files
        run: python generate_audio.py

      - name: Commit and push audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/
          git diff --cached --quiet || git commit -m "Add generated HSK audio files"
          git push
